project:
  name: crocs

paths:
  raw_data_dir: data/raw
  output_dir: data/output

inputs:
  train: train.csv
  reqlabor: reqlabor.csv
  sched: sched.csv
  staff_limits: staff_limits.csv
  station_priorities: station_priorities.csv
  shifts: shifts.csv

outputs:
  forecast: forecast.xlsx
  schedule: schedule.xlsx
  labor_demand: labor_demand.xlsx
  coverage_report: coverage_report.xlsx

forecast:
  start: 2026-04-27
  end: 2026-05-03
  open_hour: 7
  close_hour: 23

scheduling:
  # null — в коде подставится 300 с. Для ~50k+ переменных чаще нужен 1200+ или configs/relaxed_scheduling.yaml
  solver_time_limit_seconds: 1200
  max_extra_coverage: 2
  # Минимум сотрудников на каждой станции в каждом почасовом слоте горизонта прогноза
  # (день × час × station_key): значение из reqlabor не может быть ниже этого порога.
  # При 2 — на станции одновременно не меньше двух человек в каждый такой слот.
  min_employees_per_station: 2
  # В перечисленные sale_hour достаточно одного человека на станцию (например 23:00).
  min_employees_relaxed_sale_hours: [23]
  max_shifts_per_employee_week: 5
  require_one_shift_per_sched_employee: true

# Ослабления для CP-SAT при INFEASIBLE/UNKNOWN на default:
# — min_employees_per_station: 1;
# — require_one_shift_per_sched_employee: false (не все из sched обязаны выйти на смену);
# — больше времени солвера и запас по max_extra_coverage / max_shifts.
# Запуск: python -m crocs --config configs/relaxed_scheduling.yaml

project:
  name: crocs

paths:
  raw_data_dir: data/raw
  output_dir: data/output

inputs:
  train: train.csv
  reqlabor: reqlabor.csv
  sched: sched.csv
  staff_limits: staff_limits.csv
  station_priorities: station_priorities.csv
  shifts: shifts.csv

outputs:
  forecast: forecast.xlsx
  schedule: schedule.xlsx
  labor_demand: labor_demand.xlsx
  coverage_report: coverage_report.xlsx

forecast:
  start: 2026-04-27
  end: 2026-05-03
  open_hour: 7
  close_hour: 23

scheduling:
  solver_time_limit_seconds: 1800
  max_extra_coverage: 3
  min_employees_per_station: 1
  min_employees_relaxed_sale_hours: []
  max_shifts_per_employee_week: 6
  require_one_shift_per_sched_employee: false

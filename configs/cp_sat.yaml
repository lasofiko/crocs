# Как configs/default.yaml, но расписание через CP-SAT (код в src/crocs/services/schedule_opt).

project:
  name: crocs

paths:
  raw_data_dir: data/raw
  output_dir: data/output
  schedule_input_dir: data/output

inputs:
  train: train.csv
  reqlabor: reqlabor.csv
  sched: sched.csv
  staff_limits: staff_limits.csv
  station_priorities: station_priorities.csv
  shifts: shifts.csv

outputs:
  forecast: forecast.xlsx
  schedule: schedule.xlsx
  labor_demand: labor_demand.xlsx
  coverage_report: coverage_report.xlsx

forecast:
  start: 2026-04-27
  end: 2026-05-03
  open_hour: 7
  close_hour: 23
  guests_source: file

scheduling:
  schedule_engine: cp_sat
  milp_solver: auto
  solver_time_limit_seconds: 300
  max_extra_coverage: 2
  min_employees_per_station: 2
  min_employees_relaxed_sale_hours: []
  max_shifts_per_employee_week: 5
  require_one_shift_per_sched_employee: true
  validation_warn_unused_sched_roster: true
  validation_warn_less_than_two_days_off: true

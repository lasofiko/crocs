[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crocs"
version = "0.1.0"
description = "Прогноз гостей и расписание персонала (ТЗ кейса)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ml = ["catboost>=1.2"]

[project.scripts]
crocs-run = "crocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
